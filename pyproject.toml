#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["torch>=2.1.0", "numpy>=1.26.4", "scipy>=1.11.4"]

[project.urls]
Repository = "https://github.com/o-l-l-i/ComfyUI-Olm-CurveEditor"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/o-l-l-i/ComfyUI-Olm-CurveEditor/wiki"
"Bug Tracker" = "https://github.com/o-l-l-i/ComfyUI-Olm-CurveEditor/issues"

